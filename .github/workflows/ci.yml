name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The Node.js versions SAP BTP, Cloud Foundry supports. Follow SAP: add a
    # version when the buildpack gains it, drop one when it loses it.
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type-check, tests included
        run: npm run test:check

      - name: Lint
        run: npm run lint:check

      - name: Test
        run: npm test
